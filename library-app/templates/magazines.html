<!DOCTYPE html>
<html>
<head>
    <title>Magazines</title>
</head>

<body>

<h1>Magazines</h1>

<table border="1" cellpadding="8">

    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Issue</th>
        <th>Publication Date</th>
        <th>Publisher</th>
    </tr>

    {% for magazine in magazines %}

    <tr>
        <td>{{ magazine[0] }}</td>
        <td>{{ magazine[1] }}</td>
        <td>{{ magazine[2] }}</td>
        <td>{{ magazine[3] }}</td>
        <td>{{ magazine[4] }}</td>
    </tr>

    {% endfor %}

</table>

<p><a href="/">Home</a></p>

</body>
</html>
