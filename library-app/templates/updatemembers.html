
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Library Member</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='static.css') }}">
</head>

<body>

    <h2>Library Member Management</h2>
    <h3>Update Member</h3>

    <p>Select a member to update their information.</p>

    <!-- Step 1: Select member -->
    <form action="{{ url_for('updatemembers') }}"
          method="GET">

        <label for="member_id">Select Member:</label>

        <select id="member_id"
                name="member_id"
                required>

            <option value="">-- Select a Member --</option>

            {% for member in members %}

                <option value="{{ member[0] }}"
                    {% if selected_member and
                          selected_member[0] == member[0] %}
                        selected
                    {% endif %}>

                    {{ member[2] }}, {{ member[1] }}
                    ({{ member[3] }})

                </option>

            {% endfor %}

        </select>

        <button type="submit">Load Member</button>

    </form>

    <!-- Step 2: Display editable information -->
    {% if selected_member %}

        <hr>

        <h3>Edit Member Information</h3>

        <form action="{{ url_for('updatemembers') }}"
              method="POST">

            <!-- Member ID -->
            <input type="hidden"
                   name="member_id"
                   value="{{ selected_member[0] }}">

            <!-- First Name -->
            <label for="first_name">First Name:</label>

            <input
                type="text"
                id="first_name"
                name="first_name"
                value="{{ selected_member[1] }}"
                maxlength="100"
                required
            >

            <br><br>

            <!-- Last Name -->
            <label for="last_name">Last Name:</label>

            <input
                type="text"
                id="last_name"
                name="last_name"
                value="{{ selected_member[2] }}"
                maxlength="100"
                required
            >

            <br><br>

            <!-- Email -->
            <label for="email">Email:</label>

            <input
                type="email"
                id="email"
                name="email"
                value="{{ selected_member[3] }}"
                maxlength="255"
                required
            >

            <br><br>

            <!-- Phone -->
            <label for="phone">Phone:</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                value="{{ selected_member[4] or '' }}"
                maxlength="30"
            >

            <br><br>

            <!-- Membership Status -->
            <label for="membership_status">
                Membership Status:
            </label>

            <select id="membership_status"
                    name="membership_status">

                <option value="ACTIVE"
                    {% if selected_member[5] == 'ACTIVE' %}
                        selected
                    {% endif %}>
                    Active
                </option>

                <option value="INACTIVE"
                    {% if selected_member[5] == 'INACTIVE' %}
                        selected
                    {% endif %}>
                    Inactive
                </option>

                <option value="SUSPENDED"
                    {% if selected_member[5] == 'SUSPENDED' %}
                        selected
                    {% endif %}>
                    Suspended
                </option>

            </select>

            <br><br>

            <!-- Submit updates -->
            <button type="submit">
                Update Member
            </button>

        </form>

    {% endif %}

    <!-- Navigation -->
    <div class="terminal-nav">

        <a href="{{ url_for('members') }}"
           class="terminal-button">
            [ VIEW MEMBERS ]
        </a>

        <a href="{{ url_for('home') }}"
           class="terminal-button">
            [ HOME ]
        </a>

    </div>

</body>
</html>
